<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A192F"/>
      <stop stop-color="#0F2E4A"/>
    </linearGradient>
    <linearGradient id="favicon-accent" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Dark Clinical Round Backdrop -->
  <rect width="48" height="48" rx="12" fill="url(#favicon-bg)"/>
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Orthopedic Cross & Biomechanical Pivot -->
  <path d="M24 11V37M11 24H37" stroke="url(#favicon-accent)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="8" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 2"/>
